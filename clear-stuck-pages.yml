
name: Clear Stuck Pages Deployment

on:
  workflow_dispatch:

permissions:
  deployments: write
  contents: read

jobs:
  clear:
    runs-on: ubuntu-latest
    steps:
      - name: Mark stuck deployment inactive
        uses: actions/github-script@v7
        with:
          script: |
            const result = await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: 7582584306,
              state: "inactive",
              description: "Clearing stale GitHub Pages deployment"
            });

            core.info(`Deployment status updated: ${result.data.state}`);
