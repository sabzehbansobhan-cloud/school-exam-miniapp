<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101827"><title>سامانه آزمون مدرسه</title>
<style>
:root{color-scheme:dark;--bg:#0b1220;--card:#141f32;--line:#26354d;--text:#f4f7fb;--muted:#a9b7cc;--blue:#60a5fa;--green:#34d399;--amber:#fbbf24}*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#101d33,#080e19 70%);color:var(--text);font-family:Tahoma,Arial,sans-serif;min-height:100vh}main{max-width:760px;margin:auto;padding:22px 15px 42px}.hero{padding:24px 20px;border:1px solid var(--line);border-radius:24px;background:linear-gradient(130deg,#172a46,#111a2a);box-shadow:0 16px 40px #0003}.tag{font-size:12px;color:#93c5fd;background:#1d3555;padding:7px 11px;border-radius:30px;display:inline-block}.hero h1{font-size:25px;margin:16px 0 8px}.hero p{margin:0;color:var(--muted);line-height:1.9;font-size:14px}.profile,.section,.exam{background:#121d2e;border:1px solid var(--line);border-radius:18px;padding:17px;margin-top:15px}.profile h2,.section h2{font-size:16px;margin:0 0 12px}.profile-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.field{padding:11px;border-radius:12px;background:#0b1423}.label{font-size:11px;color:var(--muted);margin-bottom:7px}.value{font-size:14px;overflow-wrap:anywhere}.exam h3{font-size:16px;margin:0 0 10px}.meta{display:flex;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:12px;margin:10px 0}.pill{border-radius:30px;padding:6px 9px;background:#1b2b42}.pill.active{color:var(--green)}.pill.upcoming{color:var(--amber)}.pill.past{color:#c4b5fd}.notice{padding:14px;border-radius:14px;background:#18263b;color:var(--muted);line-height:1.9;margin-top:14px;font-size:13px}.status{padding:25px 12px;text-align:center;color:var(--muted);line-height:1.9}.error{color:#fecaca}.btn{border:0;border-radius:12px;padding:11px 14px;background:#2563eb;color:white;font:inherit;cursor:pointer}.foot{text-align:center;color:#7e8da5;font-size:11px;margin-top:24px}@media(max-width:440px){.hero h1{font-size:22px}.profile-grid{grid-template-columns:1fr 1fr}.value{font-size:12px}}
</style></head>
<body><main>
<section class="hero"><span class="tag">سامانه آموزشی مدرسه</span><h1>📝 آزمون‌های من</h1><p>اینجا می‌توانی آزمون‌های اختصاص‌یافته به حساب خودت را ببینی. اطلاعات از سامانه مدرسه دریافت می‌شود.</p></section>
<div id="status" class="status">در حال دریافت اطلاعات حساب…</div>
<section id="profile" class="profile" hidden></section>
<section id="examSection" class="section" hidden><h2>آزمون‌های اختصاص‌یافته</h2><div id="exams"></div></section>
<div id="notice" class="notice" hidden></div><div class="foot">سامانه آزمون مدرسه • نسخه آزمایشی</div>
</main>
<script>
// آدرس وب‌اپی که کاربر ارائه کرده است؛ درخواست به‌صورت JSONP ارسال می‌شود.
const API_URL = 'https://script.google.com/macros/s/AKfycbzcLYFPUAhD6gxC30OkUsYYbVqFvLFL9OR2xMRdm9DsxIYq1LCnUK8ADuJH96nir2Kd/exec';
const $=id=>document.getElementById(id);
const params=new URLSearchParams(location.search);const session=params.get('session')||'';
function showStatus(message,isError=false){$('status').hidden=false;$('status').className='status'+(isError?' error':'');$('status').textContent=message;}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function dateText(v){if(!v)return 'تعیین نشده';const d=new Date(v);if(isNaN(d))return String(v);return new Intl.DateTimeFormat('fa-IR',{dateStyle:'medium',timeStyle:'short'}).format(d);}
function statusLabel(s){return ({active:'در حال برگزاری',upcoming:'به‌زودی',past:'پایان‌یافته'})[s]||s||'نامشخص';}
function render(data){if(!data||!data.ok)throw new Error(data&&data.error?data.error:'پاسخ نامعتبر از سرور دریافت شد.');const p=data.profile||{};$('status').hidden=true;$('profile').hidden=false;$('profile').innerHTML=`<h2>👤 اطلاعات دانش‌آموز</h2><div class="profile-grid"><div class="field"><div class="label">نام و نام خانوادگی</div><div class="value">${esc((p.firstName||'')+' '+(p.lastName||''))}</div></div><div class="field"><div class="label">نقش کاربری</div><div class="value">${esc(p.role==='student'?'دانش‌آموز':p.role||'—')}</div></div><div class="field"><div class="label">پایه</div><div class="value">${esc(p.grade||'ثبت نشده')}</div></div><div class="field"><div class="label">رشته</div><div class="value">${esc(p.track||'ثبت نشده')}</div></div><div class="field"><div class="label">شناسه کلاس</div><div class="value">${esc(p.classId||'ثبت نشده')}</div></div></div>`;
if(p.role!=='student'){$('examSection').hidden=true;$('notice').hidden=false;$('notice').textContent=data.message||'در حال حاضر این صفحه برای دانش‌آموزان فعال است.';return;}
const exams=Array.isArray(data.exams)?data.exams:[];$('examSection').hidden=false;if(!exams.length){$('exams').innerHTML='<div class="status">فعلاً آزمونی برای حساب شما ثبت نشده است.</div>'; }else{$('exams').innerHTML=exams.map(e=>`<article class="exam"><h3>${esc(e.title||'آزمون بدون عنوان')}</h3><div class="meta"><span class="pill">📚 ${esc(e.subject||'عمومی')}</span><span class="pill">❓ ${esc(e.questionCount||0)} سؤال</span><span class="pill">⏱ ${esc(e.durationMinutes||0)} دقیقه</span><span class="pill ${esc(e.status)}">${esc(statusLabel(e.status))}</span></div><div class="meta"><span>شروع: ${esc(dateText(e.startAt))}</span><span>پایان: ${esc(dateText(e.endAt))}</span></div><div class="notice">امکان شرکت در آزمون در مرحله بعد فعال می‌شود.</div></article>`).join('');}
if(data.message){$('notice').hidden=false;$('notice').textContent=data.message;} }
function load(){if(!session){showStatus('برای امنیت حساب، این صفحه را از دکمه «📝 آزمون‌ها» داخل ربات بله باز کن؛ باز کردن مستقیم آدرس، نشست ورود ندارد.',true);return;}const cb='miniAppCallback';window[cb]=function(data){try{render(data)}catch(e){showStatus(e.message,true)}finally{delete window[cb];const s=document.getElementById('miniapp-jsonp');if(s)s.remove();}};const s=document.createElement('script');s.id='miniapp-jsonp';s.onerror=()=>showStatus('ارتباط با سرور برقرار نشد. آدرس Web App و دسترسی انتشار را بررسی کن.',true);s.src=API_URL+'?action=bootstrap&session='+encodeURIComponent(session)+'&callback='+cb+'&_='+Date.now();document.body.appendChild(s);}
load();
</script></body></html>
